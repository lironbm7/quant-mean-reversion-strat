name: Trading Monitor

on:
  schedule:
    # GitHub Actions cron is UTC only. Locked to IDT (UTC+3): 08:30 UTC ==
    # 11:30 Israel summer time, 10:30 Israel winter time (IST = UTC+2).
    - cron: '30 8 * * 1-5'

  # Allow manual triggering for testing
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry mode (no Slack notifications)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  PYTHON_VERSION: '3.12'

jobs:
  trading-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: latest
        virtualenvs-create: true
        virtualenvs-in-project: true
        installer-parallel: true

    - name: Install dependencies
      run: poetry install --no-interaction

    - name: Write configuration from secret
      env:
        SYMBOLS_CONFIG: ${{ secrets.SYMBOLS_CONFIG }}
      run: |
        if [ -z "$SYMBOLS_CONFIG" ]; then
          echo "::error::SYMBOLS_CONFIG secret not set"
          exit 1
        fi
        # Use printenv so the value never appears on a command line and
        # cannot be accidentally echoed.
        printenv SYMBOLS_CONFIG > config/symbols.json
        echo "Config file written (content not printed)."

    - name: Run market scan
      env:
        # Slack Configuration
        SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}

        # Trading Configuration — secrets may be unset; only export when
        # non-empty so defaults in config/settings.py apply otherwise.
        # An empty string overrides the default and breaks pydantic parsing.
        _THRESHOLD_PERCENTAGE: ${{ secrets.THRESHOLD_PERCENTAGE }}
        _COOLDOWN_HOURS: ${{ secrets.COOLDOWN_HOURS }}

        # Application Configuration — ERROR-only logs, full output redirected
        # below; alerts go ONLY to Slack, never to the workflow logs.
        LOG_LEVEL: ERROR
        DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        CONFIG_FILE_PATH: config/symbols.json

      run: |
        # Promote optional trading-config secrets to real env vars only when
        # they have a value; otherwise let Settings() fall back to defaults.
        if [ -n "$_THRESHOLD_PERCENTAGE" ]; then
          export THRESHOLD_PERCENTAGE="$_THRESHOLD_PERCENTAGE"
        fi
        if [ -n "$_COOLDOWN_HOURS" ]; then
          export COOLDOWN_HOURS="$_COOLDOWN_HOURS"
        fi

        # Drop stdout so verbose INFO output (config summaries, symbol
        # names, prices, alert details) cannot leak into the public
        # workflow logs. Loguru is configured to write to stderr, and
        # LOG_LEVEL=ERROR keeps only error-level diagnostics visible.
        # Slack notifications go via HTTPS and are unaffected.
        if poetry run python src/main.py >/dev/null; then
          echo "Scan completed."
        else
          echo "::error::Scan failed (see Slack for details if configured)."
          exit 1
        fi
