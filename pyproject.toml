[tool.poetry]
name = "quant-mean-reversion-strat"
version = "0.1.0"
description = "Quantitative trading notifier for mean reversion strategies"
authors = ["github.com/lironbm7"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
pydantic = "^2.0.0"
pydantic-settings = "^2.0.0"
yfinance = "^0.2.0"
pandas = "^2.0.0"
numpy = "^1.24.0"
slack-sdk = "^3.20.0"
loguru = "^0.7.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
pytest-mock = "^3.11.0"
flake8 = "^7.2.0"
autopep8 = "^2.3.2"
pre-commit = "^3.0.0"

[tool.poetry.scripts]
trading-notifier = "src.main:main"
discover-indicators = "src.discover:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
asyncio_mode = "auto"
